[package]
name = "target-gc"
version = "0.1.0"
edition = "2021"
# std::fs::File::try_lock, which the Cargo lock checks rely on.
rust-version = "1.89"
description = "Evict idle Cargo build directories when the disk needs the space, never one a build, a process or a service is using. Ships a Claude Code skill."
license = "MIT"
repository = "https://github.com/decebal/target-gc"
readme = "README.md"
keywords = ["cargo", "target", "disk-space", "cleanup", "claude-code"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
include = [
  "src/**",
  "skills/**",
  "tests/**",
  "config.example.toml",
  "README.md",
  "LICENSE",
  "Cargo.toml",
  "Cargo.lock",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "target_gc"
path = "src/lib.rs"

[[bin]]
name = "target-gc"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[lints.clippy]
absolute_paths = "warn"
uninlined_format_args = "warn"
